name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck
      - name: Lint
        run: luacheck PSGroupFinder
      - name: Multi-client simulation
        run: lua5.1 tests/sim.lua
      - name: Build the zip
        run: ./build.sh
