<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#121418}
body{font-family:'Inter',sans-serif;color:#f7f8fd;position:relative;
